name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller "Good PDF_win.spec"

      - name: Create ZIP archive
        run: Compress-Archive -Path "dist/Good PDF/*" -DestinationPath "dist/Good-PDF-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Good-PDF-Windows
          path: dist/Good-PDF-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller -y "Good PDF.spec"

      - name: Create ZIP archive
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent "Good PDF.app" "Good-PDF-macOS.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Good-PDF-macOS
          path: dist/Good-PDF-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Good-PDF-Windows
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: Good-PDF-macOS
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Good-PDF-Windows.zip
            dist/Good-PDF-macOS.zip
          generate_release_notes: true
